; Sim config for the AngelLM "Thor" 6-axis arm (yaw-roll-roll-yaw-roll-yaw).
; Kinematics generated from the upstream Thor-ROS URDF (see models/thor_dh.py
; and models/gen_thor_config.py); UI is TurboNC (qtpyvcp tnc).
;
;[APPLICATIONS]
;DELAY = 5
;APP = halshow --fformat %12.4f sim-robot_thor.halshow

[EMC]
VERSION = 1.1
MACHINE = LinuxCNC Thor 6R sim
DEBUG = 0

[DISPLAY]
DISPLAY = qtpyvcp tnc

# QtPyVCP Specific Options
CONFIRM_EXIT =             False
;FULLSCREEN =              False
MAXIMIZE =                 True
;POSITION =                0x0
SIZE =                     1280x700
HIDE_MENU_BAR =            False
HIDE_STATUS_BAR =          False
LOG_FILE =                 sim.log
LOG_LEVEL =                WARN
PREFERENCE_FILE =          sim.pref

POSITION_OFFSET =          RELATIVE
POSITION_FEEDBACK =        ACTUAL
DCONE_BASESIZE =            0.25
MAX_FEED_OVERRIDE =        2.0
DEFAULT_SPINDLE_SPEED =    40000
MIN_SPINDLE_OVERRIDE =     0.5
MAX_SPINDLE_OVERRIDE =     1.0
PROGRAM_PREFIX =           ~/linuxcnc/nc_files
INTRO_TIME =               5
CYCLE_TIME =               0.05
HELP_FILE =                tklinuxcnc.txt
INTRO_GRAPHIC =            linuxcnc.gif
DEFAULT_LINEAR_VELOCITY =  2000
MIN_VELOCITY =             1.0
MAX_LINEAR_VELOCITY =      4000
MIN_LINEAR_VELOCITY =      1.0
DEFAULT_ANGULAR_VELOCITY = 360
MAX_ANGULAR_VELOCITY =     360
MIN_ANGULAR_VELOCITY =     1.0
INCREMENTS =               90 45 10 1 0.1 0.01 0.001
GRIDS =                    100
EDITOR =                   geany
GEOMETRY =                 X Y Z A B C
CONFIG_FILE =              tnc_config.yml
TOOL_EDITOR =              tooledit

[VTK]
; NOTE: the VTK datasource logs "MACHINE_PARTS is missing active machine axes:
; ['X','A','B','C']".  That is expected for a robot: the yml declares the joint
; rotation axes (z/-y/-z/y), not the Cartesian axes.  All Cartesian axes are
; head-owned (below), so no table-rotary origin metadata is needed.  The sibling
; sim.robot / sim.robot_ur configs emit the same warning.
MACHINE_PARTS = models/robot_thor.yml
; Draw the active tool (from the tool table) as a VTK cylinder instead of an STL.
; See qtpyvcp ToolBitActor: cylinder along the commanded tool axis.
TOOL_CYLINDER = robot
; mm from the controlled point (frame 5 = spindle nose; D[5]=105.5 includes the
; 92 mm nose offset) to where the cylinder starts.  0 => the cylinder starts at
; the nose, and the tool-table Z offset is measured nose -> tip.
TOOL_GAUGE = 0
CPP_BACKPLOT = 1

; Owner values must be 'head' or 'table' (the datasource rejects anything
; else). A robot arm moves the tool, so every world axis is head-owned.
X = head
Y = head
Z = head
A = head
B = head
C = head

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = subroutines
REMAP = M428 modalgroup=10 ngc=428
REMAP = M429 modalgroup=10 ngc=429

[EMCMOT]
EMCMOT =           motmod
BASE_PERIOD =      50000
SERVO_PERIOD =     1000000
TRAJ_PERIOD =      100000
COMM_TIMEOUT =     1.0
HOMEMOD =          homemod

[TASK]
TASK =             milltask
CYCLE_TIME =       0.010

[HAL]
HALUI   =          halui
HALFILE =          sim-robot_thor-core.hal
HALFILE =          sim-robot_thor-joints.hal
HALFILE =          robot_thor-kinematics.hal
POSTGUI_HALFILE =  robot_thor-postgui.hal

[HALUI]

[TRAJ]
COORDINATES =                  X Y Z A B C
ARC_BLEND_ENABLE =             1
ARC_BLEND_FALLBACK_ENABLE =    0
ARC_BLEND_OPTIMIZATION_DEPTH = 50
ARC_BLEND_GAP_CYCLES =         4
ARC_BLEND_RAMP_FREQ =          100
SPINDLES =                     1
LINEAR_UNITS =                 mm
ANGULAR_UNITS =                deg
DEFAULT_LINEAR_VELOCITY =      2000.0
MAX_LINEAR_VELOCITY =          4000.0
DEFAULT_LINEAR_ACCELERATION =  1000.0
MAX_LINEAR_ACCELERATION =      4000.0
MAX_ANGULAR_VELOCITY =         720
NO_FORCE_HOMING =              1
; World HOME = FK of the joint HOME values in machine coords [0,85,5,180,90,180]
; (i.e. the pose reached after homing): the spindle hangs VERTICALLY (nose
; straight down) at this pose.  See HOME_Q in models/thor_dh.py.  The controlled
; point is the spindle NOSE (frame 5); FK(joints=0) = 160 0 127.284 (the flange/
; renderer home pose) is not the HOME.
HOME =                         207.945 0.000 242.107 -180.000 0.000 -180.000

[KINS]
KINEMATICS = genserkins coordinates=xyzabc
JOINTS =     6

[EMCIO]
EMCIO =                io
CYCLE_TIME =           0.100
; Tool-change pose: the home pose (flange in front of the base).
TOOL_CHANGE_POSITION = 207.945 0.000 242.107 -180.000 0.000 -180.000
TOOL_TABLE = tooltable.tbl
# The DB backend serves the tool table from mill_tools.db (created from
# tooltable.tbl with qtpyvcp.lib.db_tool.import_legacy_tbl). The first token
# must be an ABSOLUTE path: linuxcnc's fork_create() uses execv(), which does
# no PATH lookup, so a bare 'tool_db_backend' never spawns.
DB_PROGRAM = /home/turboss/Dev/CNC/venv/bin/tool_db_backend /home/turboss/Dev/CNC/turbonc/linuxcnc/configs/sim.robot_thor/mill_tools.db

; Cartesian (TCP) soft limits - a conservative box around the reach envelope
; (max nose reach 459.5 mm from the shoulder at (0,0,202)). reach_guard.py stops
; jogs that leave the spherical envelope, which a box cannot express.
[AXIS_X]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -470.0
MAX_LIMIT =          470.0

[AXIS_Y]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -470.0
MAX_LIMIT =          470.0

[AXIS_Z]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -110.0
MAX_LIMIT =          670.0

[AXIS_A]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

[AXIS_B]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

[AXIS_C]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

; Joint limits: +/-360 on every joint, matching the other robot sims.
; The real Thor pitches are +/-90, but genserkins' IK flips to the mirrored
; branch on Cartesian jogs and then trips a tight joint soft limit (e.g.
; "soft limit exceeded" on JOINT_4) even though the pose is reachable.  Full
; +/-360 lets the solver pick either branch; reach_guard.py still stops jogs
; that actually leave the reach envelope.
[JOINT_0]
NAME =               A1
TYPE =               ANGULAR
MAX_VELOCITY =       360
MAX_ACCELERATION =   50000
MIN_LIMIT =         -720.0
MAX_LIMIT =          720.0
FERROR =             1.00
MIN_FERROR =         100
DEADBAND =           0
MAX_OUTPUT =         1.00
MAX_ERROR =          100
HOME =                  0.0
HOME_OFFSET =           0
HOME_SEARCH_VEL =       0
HOME_LATCH_VEL =        0
HOME_USE_INDEX =        NO
HOME_ABSOLUTE_ENCODER = 1
HOME_SEQUENCE =         0
BIAS = 0
P =    0
I =    0
D =    0
FF0 =  0
FF1 =  0
FF2 =  0

