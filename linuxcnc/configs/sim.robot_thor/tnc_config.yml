# TurboNC machine-specific settings for the Thor 6R robot sim.
# Layered on top of src/tnc/config.yml (loaded by `DISPLAY = qtpyvcp tnc`).

windows:
  mainwindow:
    kwargs:
      confirm_exit: false


# This sections defines the default Data Sources
data_plugins:
  status:
    provider: qtpyvcp.plugins.status:Status
    kwargs:
      # Poll period (ms).  Lower keeps the backplot tool/arm in step during
      # fast motion (the VTK updates on the status tick).
      cycle_time: 30

  persistent_data_manager:
    provider: qtpyvcp.plugins.persistent_data_manager:PersistentDataManager
    kwargs:
      # serialization method to use: json or pickle
      serialization_method: pickle
      # persistence_file: .vcp_data.json

  settings:
    provider: qtpyvcp.plugins.settings:Settings

  position:
    provider: qtpyvcp.plugins.positions:Position
    kwargs:
      report_actual_pos: True
      use_program_units: True

  tooltable:
    # DB-backed: shares [EMCIO] DB_PROGRAM's mill_tools.db with the
    # LinuxCNC-spawned tool_db_backend (single source of truth). The legacy
    # file-based plugin can't persist anything here and leaves the DB-backed
    # Tools-tab widgets (ToolSTLField) pointed at an unconfigured db.sqlite.
    provider: qtpyvcp.plugins.db_tool_table:DBToolTable
    kwargs:
        columns: TXYZABCDR
        # Mill flavor: enables the tool_mill extras (ATC) column.
        extras: mill

  offsettable:
    provider: qtpyvcp.plugins.offset_table:OffsetTable
    kwargs:
      # Only the axes this machine has; the plugin defaults to XYZABCUVWR,
      # and G10 L2 with U/V/W/R on an XYZABC machine is a "bad character" error.
      columns: XYZABC

  notifications:
    provider: qtpyvcp.plugins.notifications:Notifications
    kwargs:
      # show notification popups
      enabled: True
      # "native" or "dbus"
      mode: native
      # max number of notifications to show
      max_messages: 5
      # whether to save messages on exit
      persistent: True

  file_locations:
    provider: qtpyvcp.plugins.file_locations:FileLocations
    log_level: debug
    kwargs:
      default_location: NC Files
      local_locations:
        # format: Location Name: path
        Home: ~/
        Desktop: ~/Desktop
        NC Files: ~/linuxcnc/nc_files
      network_locations:

    exportedhal:
        provider: qtpyvcp.plugins.exported_hal:ExportedHal

  virtual_input:
    provider: qtpyvcp.plugins.virtual_input_manager:VirtualInputManager


dialogs:
  home_all:
    provider: tnc.dialogs.home_all:HomeAll
    #kwargs:
    #  ui_file: {{ file.dir }}/dialogs/home_all.ui
  toolchange:
    provider: qtpyvcp.widgets.dialogs.toolchange_dialog:ToolChangeDialog
