[EMC]
VERSION = 1.1
MACHINE = LinuxCNC-HAL-Meca500-EtherCAT-test
DEBUG = 0

[DISPLAY]
DISPLAY = qtpyvcp tnc

# QtPyVCP Specific Options
CONFIRM_EXIT =             False
;FULLSCREEN =              False
;MAXIMIZE =                False
;POSITION =                0x0
SIZE =                     1280x700
HIDE_MENU_BAR =            False
HIDE_STATUS_BAR =          False
LOG_FILE =                 sim.log
LOG_LEVEL =                DEBUG
PREFERENCE_FILE =          sim.pref

POSITION_OFFSET =          RELATIVE
POSITION_FEEDBACK =        ACTUAL
;DRO_FORMAT_MM =            %+010.6f ; FIXME bugs from ini_to_yaml
;DRO_FORMAT_IN =            %+010.6f ; FIXME bugs from ini_to_yaml
DCONE_BASESIZE =            0.25
MAX_FEED_OVERRIDE =        2.0
DEFAULT_SPINDLE_SPEED =    40000
MIN_SPINDLE_OVERRIDE =     0.5
MAX_SPINDLE_OVERRIDE =     1.0
PROGRAM_PREFIX =           ~/linuxcnc/nc_files
INTRO_TIME =               5
CYCLE_TIME =               0.05
HELP_FILE =                tklinuxcnc.txt
INTRO_GRAPHIC =            linuxcnc.gif
DEFAULT_LINEAR_VELOCITY =  2000
MIN_VELOCITY =             1.0
MAX_LINEAR_VELOCITY =      4000
MIN_LINEAR_VELOCITY =      1.0
DEFAULT_ANGULAR_VELOCITY = 360
MAX_ANGULAR_VELOCITY =     360
MIN_ANGULAR_VELOCITY =     1.0
INCREMENTS =               90 45 10 1 0.1 0.01 0.001
GRIDS =                    100
# leave OPEN_FILE off while trying to figure whats the issue
;OPEN_FILE =                ~/linuxcnc/nc_files/qtpyvcp/qtpyvcp.ngc
EDITOR =                   geany
GEOMETRY =                 X Y Z A B C
CONFIG_FILE =              tnc_config.yml
TOOL_EDITOR =              tooledit



[VTK]
MACHINE_PARTS = models/robot_arm.yml
CPP_BACKPLOT = 1

X = tool
Y = tool
Z = tool
A = tool
B = tool
C = tool

;ROBOT =                    models/robot_arm.yml
;TABLE =                    models/robot_arm/robot_arm_base.stl
;SPINDLE =                  models/robot_arm/spindle_assy.stl


[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = subroutines
FEATURES = 30
# subroutines/428.ngc and 429.ngc select the kinematics via
# motion.switchkins-type (0 = genserkins/cartesian, 1 = identity/joint).
# They are plain o-word subs, so they only become usable as M428/M429 once
# remapped here - without these two lines the mode buttons in the UI (and any
# sub_r*_c*.ngc, which all call M429/M428) fail with "unknown m code".
REMAP = M428 modalgroup=10 ngc=428
REMAP = M429 modalgroup=10 ngc=429
# RS274NGC_STARTUP_CODE = G10 L2 P1 X0 Y0 Z0 A180 B0 C180 G54
# when homed with T99 machine should be X190 Y0 Z308 A0 B90 C0

[EMCMOT]
EMCMOT =           motmod
BASE_PERIOD =      50000
SERVO_PERIOD =     1000000
TRAJ_PERIOD =      100000
COMM_TIMEOUT =     1.0
HOMEMOD =          homemod

[TASK]
TASK =             milltask
CYCLE_TIME =       0.010

[HAL]
HALUI   =          halui
HALFILE =          sim-robot_arm-core.hal
HALFILE =          sim-robot_arm-joints.hal
HALFILE =          robot_arm-kinematics.hal
POSTGUI_HALFILE =  robot_arm-postgui.hal

[HALUI]

[TRAJ]
COORDINATES =                  X Y Z A B C
ARC_BLEND_ENABLE =             1
ARC_BLEND_FALLBACK_ENABLE =    0
ARC_BLEND_OPTIMIZATION_DEPTH = 50
ARC_BLEND_GAP_CYCLES =         4
ARC_BLEND_RAMP_FREQ =          100
SPINDLES =                     1
LINEAR_UNITS =                 mm
ANGULAR_UNITS =                deg
DEFAULT_LINEAR_VELOCITY =      2000.0
MAX_LINEAR_VELOCITY =          4000.0
DEFAULT_LINEAR_ACCELERATION =  1000.0
MAX_LINEAR_ACCELERATION =      4000.0
MAX_ANGULAR_VELOCITY =         720
NO_FORCE_HOMING =              1
HOME =                         0 0 0 0 0 0

[KINS]
KINEMATICS = genserkins coordinates=xyzabc
JOINTS =     6

[EMCIO]
EMCIO =                io
CYCLE_TIME =           0.100
TOOL_CHANGE_POSITION = 200.0 0.0 265.0 180.0 90.0 180.0
TOOL_TABLE = tool.tbl
#TOOL_TABLE = tool.tbl
# The DB backend serves the tool table from mill_tools.db (created from
# tooltable.tbl with qtpyvcp.lib.db_tool.import_legacy_tbl). The first token
# must be an ABSOLUTE path: linuxcnc's fork_create() uses execv(), which does
# no PATH lookup, so a bare 'tool_db_backend' never spawns. The second token
# is the database file shared with the GUI.
DB_PROGRAM = /home/turboss/Dev/CNC/venv/bin/tool_db_backend /home/turboss/Dev/CNC/turbonc/linuxcnc/configs/sim.robot/mill_tools.db
#TOOL_DB_FILE = mill_tools.db


; Cartesian (TCP) soft limits - widened to the arm's real reach envelope
; (~716 mm from the base: 186+224+230+76). The previous values (402/252/600)
; were tighter than the reachable envelope and rejected valid poses even
; with every joint inside its own limits.
[AXIS_X]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -800.0
MAX_LIMIT =          800.0

[AXIS_Y]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -800.0
MAX_LIMIT =          800.0

[AXIS_Z]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -400.0
MAX_LIMIT =          800.0

[AXIS_A]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

[AXIS_B]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

[AXIS_C]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

