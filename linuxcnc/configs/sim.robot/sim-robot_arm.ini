[EMC]
VERSION = 1.1
MACHINE = LinuxCNC-HAL-KUKA-KR-sim
DEBUG = 0

[DISPLAY]
DISPLAY = qtpyvcp tnc

# QtPyVCP Specific Options
CONFIRM_EXIT =             False
;FULLSCREEN =              False
;MAXIMIZE =                False
;POSITION =                0x0
SIZE =                     1280x700
HIDE_MENU_BAR =            False
HIDE_STATUS_BAR =          False
LOG_FILE =                 sim.log
LOG_LEVEL =                DEBUG
PREFERENCE_FILE =          sim.pref

POSITION_OFFSET =          RELATIVE
POSITION_FEEDBACK =        ACTUAL
;DRO_FORMAT_MM =            %+010.6f ; FIXME bugs from ini_to_yaml
;DRO_FORMAT_IN =            %+010.6f ; FIXME bugs from ini_to_yaml
DCONE_BASESIZE =            0.25
MAX_FEED_OVERRIDE =        2.0
DEFAULT_SPINDLE_SPEED =    40000
MIN_SPINDLE_OVERRIDE =     0.5
MAX_SPINDLE_OVERRIDE =     1.0
PROGRAM_PREFIX =           ~/linuxcnc/nc_files
INTRO_TIME =               5
CYCLE_TIME =               0.05
HELP_FILE =                tklinuxcnc.txt
INTRO_GRAPHIC =            linuxcnc.gif
DEFAULT_LINEAR_VELOCITY =  2000
MIN_VELOCITY =             1.0
MAX_LINEAR_VELOCITY =      4000
MIN_LINEAR_VELOCITY =      1.0
DEFAULT_ANGULAR_VELOCITY = 360
MAX_ANGULAR_VELOCITY =     360
MIN_ANGULAR_VELOCITY =     1.0
INCREMENTS =               90 45 10 1 0.1 0.01 0.001
GRIDS =                    100
# leave OPEN_FILE off while trying to figure whats the issue
;OPEN_FILE =                ~/linuxcnc/nc_files/qtpyvcp/qtpyvcp.ngc
EDITOR =                   geany
GEOMETRY =                 X Y Z A B C
CONFIG_FILE =              tnc_config.yml
TOOL_EDITOR =              tooledit



[VTK]
MACHINE_PARTS = models/robot_arm.yml
CPP_BACKPLOT = 1

; Owner values must be 'head' or 'table' (the datasource rejects anything
; else). A robot arm moves the tool, so every world axis is head-owned.
X = head
Y = head
Z = head
A = head
B = head
C = head

;ROBOT =                    models/robot_arm.yml
;TABLE =                    models/robot_arm/robot_arm_base.stl
;SPINDLE =                  models/robot_arm/spindle_assy.stl


[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = subroutines
# NOTE: FEATURES is the pre-2.8 bitmask and is ignored by this tree, which
# reads the individual boolean keys (INI_VARS, HAL_PIN_VARS, ...) instead.
# Kept only so older configs still parse; it has no effect here.
FEATURES = 30
# subroutines/428.ngc and 429.ngc select the kinematics with G12.1 P-,
# which synchronises the interpreter and motion in one step
# (0 = genserkins/cartesian, 1 = identity/joint). They are plain o-word subs,
# so they only become usable as M428/M429 once remapped here - without these
# two lines the mode buttons in the UI (and any program that calls
# M429/M428, e.g. sim-example.ngc) fail with "unknown m code".
REMAP = M428 modalgroup=10 ngc=428
REMAP = M429 modalgroup=10 ngc=429
# RS274NGC_STARTUP_CODE = G10 L2 P1 X0 Y0 Z0 A180 B0 C180 G54
# when homed with T99 machine should be X190 Y0 Z308 A0 B90 C0

[EMCMOT]
EMCMOT =           motmod
BASE_PERIOD =      50000
SERVO_PERIOD =     1000000
TRAJ_PERIOD =      100000
COMM_TIMEOUT =     1.0
HOMEMOD =          homemod

[TASK]
TASK =             milltask
CYCLE_TIME =       0.010

[HAL]
HALUI   =          halui
HALFILE =          sim-robot_arm-core.hal
HALFILE =          sim-robot_arm-joints.hal
HALFILE =          robot_arm-kinematics.hal
POSTGUI_HALFILE =  robot_arm-postgui.hal

[HALUI]

[TRAJ]
COORDINATES =                  X Y Z A B C
ARC_BLEND_ENABLE =             1
ARC_BLEND_FALLBACK_ENABLE =    0
ARC_BLEND_OPTIMIZATION_DEPTH = 50
ARC_BLEND_GAP_CYCLES =         4
ARC_BLEND_RAMP_FREQ =          100
SPINDLES =                     1
LINEAR_UNITS =                 mm
ANGULAR_UNITS =                deg
DEFAULT_LINEAR_VELOCITY =      2000.0
MAX_LINEAR_VELOCITY =          4000.0
DEFAULT_LINEAR_ACCELERATION =  1000.0
MAX_LINEAR_ACCELERATION =      4000.0
MAX_ANGULAR_VELOCITY =         720
NO_FORCE_HOMING =              1
; World home must be the FK of the JOINT_x HOME values [0,-90,40,0,-50,0]:
; the DH in robot_arm-kinematics.hal gives TCP (337.846, 0, 290.663) with
; RPY (0, -80, 180) - the tool held horizontal, which is the orientation
; genserkins' iterative IK solves reliably while Cartesian jogging.
; linuxcnc.var stores the same pose as the G54 offset.
HOME =                         337.846 0.0 290.663 0.0 -80.0 180.0

[KINS]
KINEMATICS = genserkins coordinates=xyzabc
JOINTS =     6

[EMCIO]
EMCIO =                io
CYCLE_TIME =           0.100
; Tool-change pose: the arm presents the tool straight down at ~280mm height,
; 265mm in front of the base (joints [0,-80,-20,0,100,0]) - comfortable for a
; manual change and well-conditioned (sigma_min ~0.61). Reachable by
; construction: it is the FK of in-limit joints. The old (200,0,265,180,90,180)
; became unreachable once the TCP moved to the spindle nose (D-5 = 164.15).
TOOL_CHANGE_POSITION = 395 0.0 411.0 0.0 -90 180
TOOL_TABLE = tooltable.tbl
#TOOL_TABLE = tool.tbl
# The DB backend serves the tool table from mill_tools.db (created from
# tooltable.tbl with qtpyvcp.lib.db_tool.import_legacy_tbl). The first token
# must be an ABSOLUTE path: linuxcnc's fork_create() uses execv(), which does
# no PATH lookup, so a bare 'tool_db_backend' never spawns. The second token
# is the database file shared with the GUI.
DB_PROGRAM = /home/turboss/Dev/CNC/venv/bin/tool_db_backend /home/turboss/Dev/CNC/turbonc/linuxcnc/configs/sim.robot/mill_tools.db
#TOOL_DB_FILE = mill_tools.db


; Cartesian (TCP) soft limits - bounded to the actual reach envelope so
; genserkins is never asked to invert an unreachable pose (which faults the
; machine with "kinematicsInverse failed"). Sampled over the joint limits:
;   X,Y in [-617, +617]  Z in [-432, +803]  (reach radius max 618 from the
;   shoulder, which is at (0, 0, 186)). These are a conservative bounding box;
;   reach_guard.py (sim-robot_arm-core.hal) additionally stops jogs that head
;   out of the spherical reach envelope, which a box cannot express.
[AXIS_X]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -600.0
MAX_LIMIT =          600.0

[AXIS_Y]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -600.0
MAX_LIMIT =          600.0

[AXIS_Z]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000
MIN_LIMIT =         -430.0
MAX_LIMIT =          800.0

[AXIS_A]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

[AXIS_B]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

[AXIS_C]
MAX_VELOCITY =     4000
MAX_ACCELERATION = 4000

[JOINT_0]
NAME =               A1
TYPE =               ANGULAR
MAX_VELOCITY =       360
MAX_ACCELERATION =   50000
; base yaw: allow multi-turn like the tool roll (J5)
MIN_LIMIT =         -720.0
MAX_LIMIT =          720.0
FERROR =             1.00
MIN_FERROR =         100
DEADBAND =           0
MAX_OUTPUT =         1.00
MAX_ERROR =          100
HOME =                  0
HOME_OFFSET =           0
HOME_SEARCH_VEL =       0
HOME_LATCH_VEL =        0
HOME_USE_INDEX =        NO
HOME_ABSOLUTE_ENCODER = 1
HOME_SEQUENCE =         0
BIAS = 0
P =    0
I =    0
D =    0
FF0 =  0
FF1 =  0
FF2 =  0

[JOINT_1]
NAME =               A2
MAX_VELOCITY =       360
MAX_ACCELERATION =   50000
TYPE =               ANGULAR
MIN_LIMIT =          -200
MAX_LIMIT =          200
FERROR =             1.00
MIN_FERROR =         100
DEADBAND =           0
MAX_OUTPUT =         1.00
MAX_ERROR =          100
; HOME -90deg with the STL-derived DH table: the arm then displays in the
; classic drawn (vertical) orientation - see robot_arm-kinematics.hal.
HOME =                  -90.0
HOME_OFFSET =           0
HOME_SEARCH_VEL =       0
HOME_LATCH_VEL =        0
HOME_USE_INDEX =        NO
HOME_ABSOLUTE_ENCODER = 1
HOME_SEQUENCE =         0
BIAS = 0
P =    0
I =    0
D =    0
FF0 =  0
FF1 =  0
FF2 =  0

[JOINT_2]
NAME =               A3
TYPE =               ANGULAR
MAX_VELOCITY =       360
MAX_ACCELERATION =   50000
; elbow: symmetric range (was -135..+70)
MIN_LIMIT =         -170.0
MAX_LIMIT =          170.0
FERROR =             1.00
MIN_FERROR =         100
DEADBAND =           0
MAX_OUTPUT =         1.00
MAX_ERROR =          100
; Elbow bent 40deg at home. With the shoulder at -90 (JOINT_1) and the wrist
; at -50 (JOINT_4) this puts the tool horizontal - the orientation genserkins
; solves most reliably while Cartesian jogging. See [TRAJ]HOME.
HOME =                  40.0
HOME_OFFSET =           0
HOME_SEARCH_VEL =       0
HOME_LATCH_VEL =        0
HOME_USE_INDEX =        NO
HOME_ABSOLUTE_ENCODER = 1
HOME_SEQUENCE =         0
BIAS = 0
P =    0
I =    0
D =    0
FF0 =  0
FF1 =  0
FF2 =  0

[JOINT_3]
NAME =               A4
TYPE =               ANGULAR
MAX_VELOCITY =       600
MAX_ACCELERATION =   50000
; forearm roll: multi-turn (was +/-170, which the arm was parked outside
; of at -180.5 - that is what rejected sonic_cut2.ngc at line 0)
MIN_LIMIT =         -720.0
MAX_LIMIT =          720.0
FERROR =             1.00
MIN_FERROR =         100
DEADBAND =           0
MAX_OUTPUT =         1.00
MAX_ERROR =          100
HOME =                  0
HOME_OFFSET =           0
HOME_SEARCH_VEL =       0
HOME_LATCH_VEL =        0
HOME_USE_INDEX =        NO
HOME_ABSOLUTE_ENCODER = 1
HOME_SEQUENCE =         0
BIAS = 0
P =    0
I =    0
D =    0
FF0 =  0
FF1 =  0
FF2 =  0

[JOINT_4]
NAME =               A5
TYPE =               ANGULAR
MAX_VELOCITY =       600
MAX_ACCELERATION =   50000
; wrist pitch: widened from the real Meca500's +/-115 so the sim can point
; the tool past the old limit; +/-180 is the natural pitch range (J4=0 is the
; wrist singularity, see the HOME note below - it is still reachable).
MIN_LIMIT =         -180.0
MAX_LIMIT =          180.0
FERROR =             1.00
MIN_FERROR =         100
DEADBAND =           0
MAX_OUTPUT =         1.00
MAX_ERROR =          100
; HOME -50deg: with the elbow at +40 (JOINT_2) this holds the tool horizontal.
; A nose-down tool (J4=+90) is well conditioned at the home pose itself but
; makes a +X Cartesian jog diverge in genserkins' iterative IK around mid
; workspace; horizontal is the reliable jogging orientation. It is also well
; clear of the J4=0 wrist singularity (sigma_min ~0.15 vs ~0.02 at J4=5).
; TCP ~ (338, 0, 291). See [TRAJ]HOME.
HOME =                  -50.0
HOME_OFFSET =           0
HOME_SEARCH_VEL =       0
HOME_LATCH_VEL =        0
HOME_USE_INDEX =        NO
HOME_ABSOLUTE_ENCODER = 1
HOME_SEQUENCE =         0
BIAS = 0
P =    0
I =    0
D =    0
FF0 =  0
FF1 =  0
FF2 =  0

[JOINT_5]
NAME =               A6
TYPE =               ANGULAR
MAX_VELOCITY =       1000
MAX_ACCELERATION =   50000
MIN_LIMIT =         -720.0
MAX_LIMIT =          720.0
FERROR =             1.00
MIN_FERROR =         100
DEADBAND =           0
MAX_OUTPUT =         1.00
MAX_ERROR =          100
; HOME 0 (was 180): at 180deg the tool-roll points the spindle UP (upside
; down) and the tool cone sticks out the wrong end. 0 keeps the spindle
; hanging nose-down as authored.
HOME =                  0.0
HOME_OFFSET =           0
HOME_SEARCH_VEL =       0
HOME_LATCH_VEL =        0
HOME_USE_INDEX =        NO
HOME_ABSOLUTE_ENCODER = 1
HOME_SEQUENCE =         0
BIAS = 0
P =    0
I =    0
D =    0
FF0 =  0
FF1 =  0
FF2 =  0

[SPINDLE_0]
MAX_VELOCITY =   40000
MIN_VELOCITY =   1000
INCREMENT =      500
