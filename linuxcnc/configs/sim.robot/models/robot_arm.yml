# Robot arm machine-parts definition for the sim.robot arm (STL-derived).
#
# The STLs were measured from the assembly and re-authored onto the DH home
# frames (theta=0): the arm is drawn straight - base yaw at z=186, upper arm
# 224 along +x, forearm 230 hanging down, flange 76 below the wrist. The
# DH renderer moves a part with the relative transform
#   M_current(joint) @ inv(M_home(joint))
# which spins it about its own joint axis at the physical pivot, so the view
# tracks genserkins exactly.
#
# `position` is kept at zero (the actor adds no extra offset). `origin` is the
# joint pivot on the DH home frame (used for the on-screen pivot cross).
# `mount` is the DH link pose of the joint frame relative to its parent:
# [a, -sin(alpha)*d, cos(alpha)*d, alpha_deg, 0, 0], which the "Compute DH
# from parts" button round-trips back to (alpha, a, d). It mirrors the values
# in robot_arm-kinematics.hal:
#   alpha [0, -90, 0, -90, 90, -90]   a [0, 0, 224, 0, 0, 0]
#   d     [186, 0, 0, 230, 0, 76]
# The machine HOME pose [0, -90, 0, 0, 10, 180] shows the arm in the classic
# drawn/vertical orientation.

root:
    id: "table"
    color: [0.33, 0.33, 0.33]
    power: 3
    model: "models/table.stl"
    type: "table"
    position: [0, 0, 0, 0, 0, 0]
    origin: [0, 0, 0]
    axis: null
    joint: null
    base:
        id: "BASE"
        color: [0.33, 0.33, 0.33]
        power: 3
        model: "models/arm_base.stl"
        type: "table"
        position: [0, 0, 0, 0, 0, 0]
        origin: [0, 0, 0]
        axis: null
        joint: null
        joint_0:
            id: "joint_0"
            color: [0.33, 0.33, 0.33]
            power: 3
            model: "models/arm_joint_0.stl"
            type: "angular"
            position: [0, 0, 0, 0, 0, 0]
            origin: [0, 0, 76]
            axis: "z"
            joint: 0
            # d-0 = 186: base -> shoulder height.
            mount: [0, 0, 186, 0, 0, 0]
            joint_1:
                id: "joint_1"
                color: [0.33, 0.33, 0.33]
                power: 3
                model: "models/arm_joint_1.stl"
                type: "angular"
                position: [0, 0, 0, 0, 0, 0]
                origin: [0, 0, 186]
                axis: "y"
                joint: 1
                # alpha-1 = -90: shoulder pitch axis (+Y) is perpendicular to
                # the base yaw (+Z).
                mount: [0, 0, 0, -90, 0, 0]
                joint_2:
                    id: "joint_2"
                    color: [0.33, 0.33, 0.33]
                    power: 3
                    model: "models/arm_joint_2.stl"
                    type: "angular"
                    position: [0, 0, 0, 0, 0, 0]
                    origin: [224, 0, 186]
                    axis: "y"
                    joint: 2
                    # a-2 = 224: the upper-arm length (shoulder -> elbow).
                    mount: [224, 0, 0, 0, 0, 0]
                    joint_3:
                        id: "joint_3"
                        color: [0.33, 0.33, 0.33]
                        power: 3
                        model: "models/arm_joint_3.stl"
                        type: "angular"
                        position: [0, 0, 0, 0, 0, 0]
                        # J3 is the forearm ROLL. At the DH zero pose the
                        # forearm hangs straight down, so the roll axis is -Z.
                        origin: [224, 0, 60]
                        axis: "-z"
                        joint: 3
                        # d-3 = 230: forearm length (elbow -> wrist).
                        mount: [0, 230, 0, -90, 0, 0]
                        joint_4:
                            id: "joint_4"
                            color: [0.33, 0.33, 0.33]
                            power: 3
                            model: "models/arm_joint_4.stl"
                            type: "angular"
                            position: [0, 0, 0, 0, 0, 0]
                            origin: [224, 0, -44]
                            axis: "y"
                            joint: 4
                            # alpha-4 = +90: wrist pitch.
                            mount: [0, 0, 0, 90, 0, 0]
                            joint_5:
                                id: "joint_5"
                                color: [0.33, 0.33, 0.33]
                                power: 3
                                model: "models/arm_joint_5.stl"
                                type: "angular"
                                position: [0, 0, 0, 0, 0, 0]
                                # J5 is the tool ROLL; its flange disc is at
                                # the bottom of the hanging wrist.
                                origin: [224, 0, -120]
                                axis: "-z"
                                joint: 5
                                # d-5 = 164.15: wrist pitch -> flange (76) + the
                                # spindle depth (88.15) so the TCP sits at the
                                # spindle's tool-exit face (where the tool
                                # renders). See robot_arm-kinematics.hal.
                                mount: [0, 164.15, 0, -90, 0, 0]
                                # Spindle / end-effector, re-authored onto the
                                # DH tool home frame like the other meshes. It
                                # is a child of the J5 assembly so it follows
                                # the arm (the dialog skips its synthetic tool
                                # actor when this part is present).
                                spindle:
                                    id: "spindle"
                                    color: [0.55, 0.55, 0.6]
                                    power: 3
                                    model: "models/spindle.stl"
                                    type: "table"
                                    position: [0, 0, 0, 0, 0, 0]
                                    # the spindle's reference = the TCP at its
                                    # tool-exit face (DH tool frame origin)
                                    origin: [224, 0, -208.15]
                                    axis: null
                                    joint: null
