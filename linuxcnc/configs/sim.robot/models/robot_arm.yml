# Robot arm machine-parts definition for the sim.robot Meca500-style arm.
#
# Each STL is exported in *home-pose world coordinates* (all joints at zero):
# the mesh geometry centre coincides with that joint's DH frame origin, and the
# geometry is axis-aligned with the machine's Cartesian frame (Z up). The live
# DH renderer therefore moves a part with the relative transform
#   M_current(joint) @ inv(M_home(joint))
# which spins it about its own joint axis at the physical pivot.
#
# `position` is kept at zero (the actor adds no extra offset). `origin` is the
# joint pivot expressed in those same home-world coordinates (used for the
# on-screen pivot cross). `mount` is the DH link pose of the joint frame
# relative to its parent: [a, -sin(alpha)*d, cos(alpha)*d, alpha_deg, 0, 0],
# which the "Compute DH from parts" button round-trips back to (alpha, a, d).

root:
    id: "table"
    color: [0.33, 0.33, 0.33]
    power: 3
    model: "models/table.stl"
    type: "table"
    position: [0, 0, 0, 0, 0, 0]
    origin: [0, 0, 0]
    axis: null
    joint: null
    base:
        id: "BASE"
        color: [0.33, 0.33, 0.33]
        power: 3
