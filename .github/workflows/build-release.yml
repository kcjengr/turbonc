name: Build Release .deb

on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    name: Release .deb (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    container:
      image: debian:trixie-slim

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts git ca-certificates curl gnupg \
            dh-python pybuild-plugin-pyproject debhelper \
            python3-pip python3-setuptools \
            python3-yaml python3-dbus python3-psutil \
            python3-docopt python3-pyudev python3-six \
            python3-markupsafe python3-jinja2 python3-simpleeval \
            python3-deepdiff python3-serial python3-distro \
            python3-sqlalchemy python3-pyqtgraph python3-opengl \
            python3-pyside6.qtcore python3-pyside6.qtdbus \
            python3-pyside6.qtgui python3-pyside6.qtwidgets \
            python3-pyside6.qtopengl python3-pyside6.qtmultimedia \
            python3-pyside6.qtquick python3-pyside6.qtsvg \
            python3-pyside6.qtsql python3-pyside6.qtnetwork \
            pyside6-tools python3-qtpy \
            qml-module-qtquick-controls \
            gstreamer1.0-plugins-bad || true

      - name: Install VTK
        run: |
          apt-get install -y --no-install-recommends python3-vtk9 || \
          apt-get install -y --no-install-recommends python3-vtk7 || true

      - name: Add qtpyvcp apt repository
        run: |
          echo "deb [arch=${{ matrix.arch }}] https://repository.qtpyvcp.com/apt trixie-dev main" \
            > /etc/apt/sources.list.d/kcjengr.list
          curl -sS https://repository.qtpyvcp.com/repo/kcjengr.key | \
            gpg --dearmor > /etc/apt/trusted.gpg.d/kcjengr.gpg
          apt-get update

      - name: Install qtpyvcp
        run: |
          apt-get install -y --no-install-recommends python3-qtpyvcp

      - name: Install poetry-dynamic-versioning
        run: |
          pip3 install --break-system-packages "poetry-core>=1.0" "poetry-dynamic-versioning>=1.10"
          python3 -c "import poetry_dynamic_versioning.backend; print('OK')"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Mark repo as safe for git (all subprocesses)
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --system --add safe.directory /__w/turbonc/turbonc

      - name: Set release version
        run: |
          cd "$GITHUB_WORKSPACE"
          export DEBFULLNAME="TurBoss" DEBEMAIL="j.l.toledano.l@gmail.com"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ ! -f debian/changelog ]; then
            dch --create --package turbonc -v "${TAG_VERSION}" --distribution unstable \
              "Release ${TAG_VERSION}"
          else
            dch --newversion "${TAG_VERSION}" --distribution unstable \
              "Release ${TAG_VERSION}"
          fi

      - name: Build .deb package
        run: |
          cd "$GITHUB_WORKSPACE"
          dpkg-buildpackage -b -us -uc -d
          mkdir -p /tmp/debs
          mv ../*.deb /tmp/debs/

      - name: Show built packages
        run: |
          ls -la /tmp/debs/
          dpkg --info /tmp/debs/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbonc-release-${{ matrix.arch }}
          path: /tmp/debs/*.deb

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turbonc-release-*
          path: debs
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          files: debs/*.deb
          generate_release_notes: true

      - name: Publish to apt server
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.APT_SSH_KEY }}

      - name: Upload to apt repo
        run: |
          DEB_NAME=$(basename debs/*.deb)
          cat debs/"$DEB_NAME" | ssh -p 422 -o StrictHostKeyChecking=accept-new \
            ${{ secrets.APT_USER }}@${{ secrets.APT_HOST }} \
            "cat > /tmp/$$.deb && aptly repo add -force-replace -config=/home/buildbot/.aptly.conf trixie /tmp/$$.deb && (aptly publish update -force-overwrite -config=/home/buildbot/.aptly.conf apt/trixie || aptly publish repo -force-overwrite -config=/home/buildbot/.aptly.conf -distribution=trixie -architectures=amd64,arm64 -prefix=apt trixie) && rm /tmp/$$.deb"
