name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check src tests dump_pivots.py

      - name: Compile all Python sources
        run: python -m compileall -q src tests dump_pivots.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
