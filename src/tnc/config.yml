{% include "menubar.yml" %}

qtdesigner:
  ui_file: ( windows.mainwindow.kwargs.ui_file )
  qss_file: {{ file.dir }}/dark.qss

vcp:
  name: TurBoNC
  version: v0.0.3
  author: TurBoss
  description: Just the basic functions I need to run linuxcnc

data_plugins:
  status:
    provider: qtpyvcp.plugins.status:Status
    kwargs:
      cycle_time: 30

  clock:
    provider: qtpyvcp.plugins.clock:Clock

  persistent_data_manager:
    provider: qtpyvcp.plugins.persistent_data_manager:PersistentDataManager
    kwargs:
      # serialization method to use: json or pickle
      serialization_method: pickle
      # persistence_file: .vcp_data.json


  gcode_properties:
    provider: qtpyvcp.plugins.gcode_properties:GCodeProperties

  notifications:
    provider: qtpyvcp.plugins.notifications:Notifications
    kwargs:
      # show notification popups
      enabled: True
      # "native" or "dbus"
      mode: native
      # max number of notifications to show
      max_messages: 5
      # whether to save messages on exit
      persistent: True
  position:
    provider: qtpyvcp.plugins.positions:Position
    kwargs:
      report_actual_pos: True
      use_program_units: True

  offsettable:
    provider: qtpyvcp.plugins.offset_table:OffsetTable
#  widgets:
#    provider: qtpyvcp.plugins.widgets:Widgets

windows:
  mainwindow:
    provider: tnc.main:MainWindow
    kwargs:
      menu: ( default_menubar )
      ui_file: {{ file.dir }}/ui/window.ui

application:
  kwargs:
   stylesheet: {{ file.dir }}/dark.qss

# GCodeEditor visual styling (applied by VCPMainWindow via apply_yaml_config_to_editor)
gcode_editor_style_defaults:
  background_color: "#2d2d30"
  text_color: "#d4d4d4"
  padding: 2
  border_radius: 4
  font_family: "Probe Basic Bebas Mono"
  font_point_size: 13
  font_weight: 400
  font_style: normal
  line_number_area_background: "#3a3a3a"
  line_number_area_color: "#888888"
  line_number_font_family: "Probe Basic Bebas Mono"
  line_number_font_point_size: 11
  line_number_font_weight: 400
  line_number_font_italic: false
  current_line_highlight_enabled: true
  current_line_background: "#3a3a5a"
  current_line_color: "#d4d4d4"
  find_highlight_background: "#2848b9"
  find_highlight_text: "#d4d4d4"
  find_error_background: "#8b0000"
  find_error_text: "#d4d4d4"
  find_status_background: "#3a3a3a"
  find_status_text: "#d4d4d4"
  find_status_border: "#555555"

# GCode syntax highlighting token→color map (applied via editor.setTokenColorMap)
# Token names match GCodeHighlighter::buildPatternForToken()
gcode_syntax_profile:
  syntax_styles:
    - id: g_codes
      color: "#5082c8"
      tokens: ["G"]
    - id: m_codes
      color: "#c864a0"
      tokens: ["M"]
    - id: parameters
      color: "#5aa05a"
      tokens: ["X", "Y", "Z", "A", "B", "C", "U", "V", "W", "I", "J", "K", "R", "Q", "P", "F", "T", "H", "S", "D", "E", "L", "N", "O"]
    - id: numbers
      color: "#b46464"
      tokens: ["number"]
    - id: comments
      color: "#6e966e"
      tokens: ["comment"]
    - id: strings
      color: "#5aa0a0"
      tokens: ["string"]

dialogs:
  zero_xy:
    provider: tnc.dialogs.zero_xy:ZeroXY
    kwargs:
      ui_file: {{ file.dir }}/dialogs/zero_xy.ui

  home_all:
    provider: tnc.dialogs.home_all:HomeAll
    kwargs:
      ui_file: {{ file.dir }}/dialogs/home_all.ui


settings:
  touch-probe.calibration-offset:
    description: Probe trigger point offset.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 1

  probe-parameters.probe-tool-number:
    description: probe tool number.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 9999

  probe-parameters.step-off-width:
    description: probe step off width.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 1000

  probe-parameters.probe-fast-fr:
    description: probe fast feedrate.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 1000

  probe-parameters.probe-slow-fr:
    description: probe slow feedrate.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 1000

  probe-parameters.max-xy-distance:
    description: max x and y probe travel distance.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 100

  probe-parameters.xy-clearance:
    description: x and y clearance distance.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 1000

  probe-parameters.max-z-distance:
    description: max z probe travel distance.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 100

  probe-parameters.z-clearance:
    description: z clearance distance.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 1000

  probe-parameters.extra-probe-depth:
    description: extra probe depth.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 100

  probe-parameters.edge-width:
    description: edge width probing distance.
    default_value: 0.0
    persistent: true
    min_value: 0
    max_value: 1000

  tool-change-position.x-tool-change-position:
    description: x axis tool change position.
    default_value: 0.0
    persistent: true
    min_value: -1000
    max_value: 1000

  tool-change-position.y-tool-change-position:
    description: y axis tool change position.
    persistent: true
    min_value: -1000
    max_value: 1000

  tool-change-position.z-tool-change-position:
    description: z axis tool change position.
    default_value: 0.0
    persistent: true
    min_value: -1000
    max_value: 1000

  tool-setter-probe.fast-probe-fr:
    description: tool probe fast feedrate.
    default_value: 0.0
    persistent: true
    min_value: -1000
    max_value: 1000

  tool-setter-probe.slow-probe-fr:
    description: tool probe slow feedrate.
    default_value: 0.0
    persistent: true
    min_value: -1000
    max_value: 1000

  tool-setter-probe.z-max-travel:
    description: maximumm z travel while probing before erroring out.
    default_value: 0.0
    persistent: true
    min_value: -1000
    max_value: 1000

  tool-setter-probe.xy-max-travel:
    description: maximumm xy travel while probing before erroring out.
    default_value: 0.0
    persistent: true
    min_value: -1000
    max_value: 1000

  tool-setter-probe.retract-distance:
    description: distance tool retracts after fast probe move.
    default_value: 0.0
    persistent: true
    min_value: -1000
    max_value: 1000

  tool-setter-probe.spindle-nose-height:
    description: distance from home to tool setter for the spindle nose.
    default_value: 0.0
    persistent: true
    min_value: -1000
    max_value: 1000
  touch-probe.diameter-offset:
    default_value: .123123
    persistent: true
    min_value: 0
    max_value: 1

  dro.display-units:
    default_value: 0
    options: [Auto, Inch, Metric]

  dro.lathe-radius-mode:
    default_value: 0
    options: [Auto, Radius, Diameter]

  dro.inch-format:
    default_value: '%9.4f'
    value_type: str

  dro.millimeter-format:
    default_value: '%9.3f'
    value_type: str

  dro.degree-format:
    default_value: '%9.2f'

  # VTK backplot view settings

  backplot.show-grid:
    default_value: false

  backplot.show-program-bounds:
    default_value: false

  backplot.show-spindle:
    default_value: false

  backplot.show-tools:
    default_value: false

  backplot.show-machine-bounds:
    default_value: false

  backplot.show-machine-labels:
    default_value: false

  backplot.show-machine-ticks:
    default_value: false

  backplot.perspective-view:
    default_value: True

  backplot.view:
    default_value: 0
    options: ["X: Front View", "XZ: Lathe View", "XZ2: Lathe View", "Y: Front View", "Z: Top View", "Z2: Bottom View", "P: Isometric"]

  backplot.multitool-colors:
    default_value: True
