[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "turbonc"

[tool.poetry]
name = "turbonc"
version = "0.0.0"
authors = [
  "Tron",
  "TurBoss <j.l.toledano.l@gmail.com>"
]
description = "TurBo NC - A QtPyVCP based Virtual Control Panel for LinuxCNC"
readme = "README.md"
license = "GPL-3.0-only"
packages = [
    { include = "tnc", from = "src" },
]
# The compiled bundle is gitignored (generated), so explicitly include it in
# wheels when it has been built by generate_resources.py or debian/rules.
include = [
    { path = "src/tnc/tnc.rcc", format = ["wheel"] },
]
exclude = [
    "src/tnc/images/hex.png",
    "src/tnc/images/wood-texture.jpg",
    "src/tnc/images/brushed-metal-background.jpg",
    "src/tnc/themes/backgrounds/brushed-metal.jpg",
    "src/tnc/themes/backgrounds/wood.jpg",
    "src/tnc/themes/backgrounds/floral-vintage.jpg",
    "src/tnc/themes/backgrounds/engine-gears.jpg",
    "src/tnc/themes/backgrounds/metal-cutting.jpg",
    "src/tnc/themes/backgrounds/lake.jpg",
    "src/tnc/themes/backgrounds/barn-wood.jpg",
    "src/tnc/themes/backgrounds/edinburgh-castle.jpg",
]
# The excluded originals are only inputs for generate_themes.py; the -dim
# textures used at runtime stay in the wheel.

[tool.poetry.dependencies]
python = "^3.11"
# QtPyVCP and LinuxCNC itself come from the Debian packages / the system;
# they are intentionally not pip dependencies (the PyPI qtpyvcp release is
# old and does not provide the Qt3D0 widget this VCP uses).
PySide6 = ">=6.5"


# The compiled Qt resource bundle is generated by
# src/tnc/generate_resources.py (or by debian/rules) before the package is
# built; it is intentionally not a Poetry build script because that makes
# Poetry emit a platform/Python-version-specific wheel for pure Python code.


[tool.pyside6-project]
files = [
	"src/tnc/resources.qrc",
	"src/tnc/main.py",
	"src/tnc/ui/window.ui"]


[tool.poetry.scripts]
tnc = "tnc:main"

[tool.poetry.plugins]

[tool.poetry.plugins."qtpyvcp.vcp"]
tnc = "tnc"

[tool.poetry.plugins."qtpyvcp.widgets"]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
pattern  = "^(?P<base>\\d+\\.\\d+\\.\\d+)?"


[tool.poetry-dynamic-versioning.files."src/tnc/_version.py"]
persistent-substitution = true
initial-content = """
  # These version placeholders will be replaced later during substitution.
  __version__ = "0.0.0"
  __version_tuple__ = (0, 0, 0)
"""


[tool.poetry-dynamic-versioning.substitution]
files = ["_version.py"]
patterns = [
    '''(^__version__\s*(?::.*?)?=\s*['"])[^'"]*(['"])''',
    { value = '''(^__version_tuple__\s*(?::.*?)?=\s*\()[^)]*(\))''', mode = "tuple" },
]
folders = [
  { path = "src/tnc/" }
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI focused on real errors; the broader UP/I/SIM style set is not yet
# enforced because the QtPyVCP-facing code follows the upstream style.
select = ["E4", "E7", "E9", "F"]
# main.py must set QT_API before importing PySide6/QtPy, and the resource
# registration happens at module import time by design.
ignore = ["E402"]
